# Render blueprint for a LIVE PILOT with real students: New + > Blueprint > pick this repository.
# Render asks for the values marked "sync: false" when you create it.
# For a free demo with sample accounts instead, see README "Hosting a demo".
services:
  - type: web
    name: ngrm-pilot
    runtime: docker
    plan: starter            # paid plan: needed for the disk that keeps the database and proof files
    healthCheckPath: /api/meta
    disk:
      name: ngrm-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: ORG_NAME          # who runs the pilot, shown on the privacy notice
        sync: false
      - key: PRIVACY_CONTACT   # email students write to about their data
        sync: false
      - key: ADMIN_EMAIL       # your email: becomes the first admin account
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD    # password for your first sign-in; you choose your own straight after
        sync: false
      # Sign-in is by email and password; no codes are sent. To add emailed codes, set EMAIL_CODES=on,
      # MAIL_FROM and BREVO_API_KEY (or RESEND_API_KEY) in the Render dashboard.
